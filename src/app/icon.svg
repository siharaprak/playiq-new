<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cn" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pu" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Deep navy background -->
  <rect width="512" height="512" fill="#07101f"/>

  <!-- Purple ambient bloom -->
  <ellipse cx="256" cy="256" rx="340" ry="80" fill="rgba(100,0,200,0.45)" filter="url(#bl)"/>

  <!--
    Hero logo paths (original viewBox 770×175) scaled & centered:
    scale = 492/770 ≈ 0.639   →  logo width = 492px
    logo height ≈ 178 × 0.639 ≈ 114px
    horizontal offset = (512-492)/2 = 10
    vertical offset   = (512-114)/2 = 199
    transform="translate(10,199) scale(0.639)"
  -->
  <g transform="translate(10,199) scale(0.639)">

    <!-- ── CYAN letters: P L A Y Q ── -->

    <!-- P: vertical bar + bowl -->
    <g stroke="#00d4ff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cn)">
      <path d="M 30,15 L 30,155"/>
      <path d="M 30,15 L 95,15 Q 118,15 118,52 Q 118,88 95,88 L 30,88"/>
    </g>
    <g stroke="#7df9ff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="M 30,15 L 30,155"/>
      <path d="M 30,15 L 95,15 Q 118,15 118,52 Q 118,88 95,88 L 30,88"/>
    </g>

    <!-- L -->
    <g stroke="#00d4ff" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#cn)">
      <path d="M 140,15 L 140,155"/>
      <path d="M 140,155 L 218,155"/>
    </g>
    <g stroke="#7df9ff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M 140,15 L 140,155"/>
      <path d="M 140,155 L 218,155"/>
    </g>

    <!-- A -->
    <g stroke="#00d4ff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cn)">
      <path d="M 230,155 L 290,15 L 350,155"/>
      <path d="M 253,105 L 327,105"/>
    </g>
    <g stroke="#7df9ff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="M 230,155 L 290,15 L 350,155"/>
      <path d="M 253,105 L 327,105"/>
    </g>

    <!-- Arrow inside A crossbar (purple) -->
    <g stroke="#c77dff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#pu)">
      <path d="M 262,105 L 312,105"/>
      <path d="M 300,93 L 316,105 L 300,117"/>
    </g>
    <path d="M 262,105 L 308,105" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Y -->
    <g stroke="#00d4ff" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#cn)">
      <path d="M 362,15 L 412,85"/>
      <path d="M 462,15 L 412,85"/>
      <path d="M 412,85 L 412,155"/>
    </g>
    <g stroke="#7df9ff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M 362,15 L 412,85"/>
      <path d="M 462,15 L 412,85"/>
      <path d="M 412,85 L 412,155"/>
    </g>

    <!-- ── PURPLE: lowercase i ── -->
    <g filter="url(#pu)">
      <!-- dot -->
      <circle cx="497" cy="24" r="8" fill="#9d4edd" stroke="#c77dff" stroke-width="2"/>
      <circle cx="497" cy="24" r="4" fill="white" opacity="0.5"/>
      <!-- stem -->
      <path d="M 497,46 L 497,155" stroke="#c77dff" stroke-width="10" stroke-linecap="round"/>
      <!-- serifs -->
      <path d="M 483,46 L 511,46"   stroke="#c77dff" stroke-width="10" stroke-linecap="round"/>
      <path d="M 483,155 L 511,155" stroke="#c77dff" stroke-width="10" stroke-linecap="round"/>
      <!-- highlight -->
      <path d="M 497,46 L 497,155" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- ── CYAN: Q circle ── -->
    <circle cx="628" cy="87" r="72" stroke="#00d4ff" stroke-width="10" fill="none" filter="url(#cn)"/>
    <circle cx="628" cy="87" r="72" stroke="#7df9ff" stroke-width="3.5" fill="none" opacity="0.7"/>

    <!-- ── PURPLE: Q magnifier handle ── -->
    <g filter="url(#pu)">
      <line x1="673" y1="136" x2="712" y2="178" stroke="#9d4edd" stroke-width="12" stroke-linecap="round"/>
      <line x1="673" y1="136" x2="712" y2="178" stroke="#c77dff" stroke-width="4"  stroke-linecap="round"/>
      <line x1="673" y1="136" x2="712" y2="178" stroke="white"   stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    </g>

  </g>
</svg>
